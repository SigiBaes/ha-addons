name: OpenTelemetry Collector
version: 0.13.0
slug: otelcol
description: Bring the OpenTelemetry collector into your home
url: https://github.com/SigiBaes/ha-addons
startup: services
host_network: true
ports:
  4317/tcp: null
  4318/tcp: null
ports_description:
  4317/tcp: OTLP/gRPC
  4318/tcp: OTLP/HTTP
arch:
  - aarch64
  - amd64
  - i386
  - armv7
init: false
map:
  - homeassistant_config:rw
  - share:rw
apparmor: false
options:
  config: |
    receivers:
      otlp:
        protocols:
          grpc:
          http:
    processors:
      batch:
    exporters:
      debug:
    # health-check is activated by default
    extensions:
      pprof:
      zpages:
    service:
      extensions: [health_check,pprof,zpages]
      pipelines:
        traces:
          receivers: [otlp]
          processors: [batch]
          exporters: [debug]
        metrics:
          receivers: [otlp]
          processors: [batch]
          exporters: [debug]
        logs:
          receivers: [otlp]
          processors: [batch]
          exporters: [debug]
schema:
  config: str
